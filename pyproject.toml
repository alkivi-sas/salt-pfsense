[tool.black]
line-length = 120
skip-string-normalization = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lab: runs against the pfSense lab (needs LAB_MINION, see docs/migration/lab.md)",
]
addopts = "-m 'not lab'"

[tool.mypy]
python_version = "3.13"
files = ["tests", "_utils/pfrest*.py", "_utils/pfsense_local.py", "_utils/pfsense_config_path.py", "pfrest"]
ignore_missing_imports = true
check_untyped_defs = true

# Legacy FauxAPI client, imported by tests but not typed
[[tool.mypy.overrides]]
module = ["pfsense"]
ignore_errors = true
