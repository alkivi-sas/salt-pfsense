name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install php (helper tests)
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv sync --dev
      - name: pre-commit
        run: pipenv run pre-commit run --all-files --show-diff-on-failure
      - name: pytest
        run: pipenv run pytest
