# Legacy code (Salt modules, states, utils, grains, PHP helpers) is not reformatted in bulk:
# a file leaves the exclude list when it is rewritten (lot 4), see docs/migration/plan.md (T1.1).
exclude: ^(_modules|_states|_utils|_grains|helpers[^/]*)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: pipenv run mypy
        language: system
        types: [python]
        pass_filenames: false
